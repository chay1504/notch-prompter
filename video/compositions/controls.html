  <script>
    (function () {
      function island(w, h, r, e) {
        var l = 960 - w / 2, rt = 960 + w / 2;
        return 'path("M ' + (l - e) + ' 0 A ' + e + ' ' + e + ' 0 0 1 ' + l + ' ' + e + ' L ' + l + ' ' + (h - r) +
          ' A ' + r + ' ' + r + ' 0 0 0 ' + (l + r) + ' ' + h + ' L ' + (rt - r) + ' ' + h + ' A ' + r + ' ' + r +
          ' 0 0 0 ' + rt + ' ' + (h - r) + ' L ' + rt + ' ' + e + ' A ' + e + ' ' + e + ' 0 0 1 ' + (rt + e) + ' 0 Z")';
      }
      function spring(zeta, omega) {
        var wd = omega * Math.sqrt(1 - zeta * zeta);
        return function (t) {
          if (t >= 1) return 1;
          return 1 - Math.exp(-zeta * omega * t) * (Math.cos(wd * t) + (zeta * omega / wd) * Math.sin(wd * t));
        };

      wordsOut("#c-line2 span", 4.3);

      tl.fromTo("#c-edit-hover", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power2.out" }, 4.5);
      click(4.62);
      wordsIn("#c-line3 span", 4.55);
      tl.fromTo("#c-editor", { scale: 0.06, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: "expo.out" }, 4.7);
      tl.to("#c-cursor", { x: 1660, y: 1010, duration: 0.7, ease: "power3.inOut" }, 5.0);
      tl.to("#c-edit-hover", { opacity: 0, duration: 0.15, ease: "power2.in" }, 5.0);

      // Paste: the editor fills and the island follows in the same beat.
      tl.to("#c-caret", { opacity: 0, duration: 0.05, ease: "none" }, 5.6);
