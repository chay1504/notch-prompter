name: Build desktop apps
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows executable
        shell: pwsh
        run: |
          ./build.ps1
          Copy-Item install.ps1,uninstall.ps1,WINDOWS.md dist/
          Compress-Archive -Path dist/NotchPrompter.exe,dist/install.ps1,dist/uninstall.ps1,dist/WINDOWS.md -DestinationPath dist/NotchPrompter-Windows.zip
          $files = Get-FileHash dist/NotchPrompter.exe,dist/NotchPrompter-Windows.zip -Algorithm SHA256
          $files | ForEach-Object { $_.Hash.ToLower() + '  ' + (Split-Path $_.Path -Leaf) } | Set-Content -Encoding ascii dist/SHA256-Windows.txt
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/NotchPrompter.exe
            dist/NotchPrompter-Windows.zip
            dist/SHA256-Windows.txt
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test script timing and storage
        working-directory: macos
        run: swift test
      - name: Exercise native AppKit windows
        working-directory: macos
        run: |
          swift build
          python3 -c 'import subprocess; subprocess.run([".build/debug/NotchPrompter", "--smoke-test"], check=True, timeout=30)'
      - name: Build universal app bundle
        run: bash macos/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            macos/dist/NotchPrompter-macOS-universal.zip
            macos/dist/SHA256-macOS.txt
            macos/dist/*-smoke.png
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check website/app.js
      - run: python3 tools/check-website.py
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, macos, website]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true
      - name: Publish beta downloads
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat release-files/SHA256-Windows.txt release-files/SHA256-macOS.txt > release-files/SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" release-files/NotchPrompter.exe release-files/NotchPrompter-Windows.zip release-files/NotchPrompter-macOS-universal.zip release-files/SHA256SUMS.txt --verify-tag --prerelease --title "NotchPrompter $GITHUB_REF_NAME" --notes-file RELEASE-NOTES.md
